name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/pdf-financial-scenarios

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Financial and rendered-route tests
        run: npm test
      - name: Next production build
        run: npm run build:vercel
      - name: Typecheck
        run: npm run typecheck
